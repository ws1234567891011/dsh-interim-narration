name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.5.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes the .npmrc that makes NODE_AUTH_TOKEN usable. When switching
          # to Trusted Publishing this line must go away again.
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs a recent npm (OIDC token exchange).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Version guard
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          test "$VERSION" = "$PKG"

      # Every release must be declared: CHANGELOG section for this exact
      # version, host range in package.json, and tag == version. See
      # VERSIONING.md; this step is what makes the rule binding.
      - name: Release declaration check
        run: node test/release-check.mjs "${{ steps.tag.outputs.tag }}"

      - name: Extract release notes
        run: node test/release-notes.mjs "${{ steps.tag.outputs.tag }}"

      - name: Host plugin tests
        run: node test/smoke.mjs

      - name: Client bundle tests
        run: node test/client-smoke.mjs

      - name: Package manifest tests
        run: node test/pack-smoke.mjs

      - name: Build stable tarball
        run: |
          npm pack --silent
          mv dsh-interim-narration-*.tgz dsh-interim-narration.tgz

      # TODO: migrate to npm Trusted Publishing (OIDC). npm only lets you create
      # the trusted-publisher connection after the account has 2FA configured,
      # so this keeps using a bypass-2FA token until that happens.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dsh-interim-narration.tgz
          # The declaration comes from the CHANGELOG section, not GitHub's
          # auto-generated PR list (this project has no PRs to summarise).
          body_path: release-notes.md
          fail_on_unmatched_files: true
