name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Host plugin tests
        run: node test/smoke.mjs

      - name: Client bundle tests
        run: node test/client-smoke.mjs

      - name: Package manifest tests
        run: node test/pack-smoke.mjs

      # Runs a real headless DSH against an in-process mock LLM when a DSH
      # launcher is available and prints SKIPPED on GitHub-hosted runners.
      - name: End-to-end narration test
        run: node test/e2e.mjs
